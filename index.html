    var h = document.createElement("h3");
    h.textContent = g.label;
    sec.appendChild(h);
    inGroup.forEach(function (it) {
      sec.appendChild(makeCard(it, pickUrl(it)));
    });
    main.appendChild(sec);
  });
</script>
</body>
</html>
